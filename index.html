<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Kai Zhu's academic homepage: inverse problems, medical imaging, electrical impedance tomography, and acousto-electric tomography." />
    <meta name="author" content="Kai Zhu" />
    <meta name="theme-color" content="#244b72" />
    <link rel="canonical" href="https://brownzhu.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kai Zhu's Academic Homepage" />
    <meta property="og:description" content="Research in inverse problems, medical imaging, EIT, and AET." />
    <meta property="og:url" content="https://brownzhu.github.io/" />
    <title id="title">Kai Zhu's Academic Homepage</title>

    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,wght@0,500;1,500&family=Noto+Serif+SC:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <link href="static/css/styles.css" rel="stylesheet" />
    <link href="static/css/main.css" rel="stylesheet" />

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                processRefs: true,
                tags: 'ams',
                tagSide: 'right',
                tagIndent: '0.8em',
                useLabelIds: true,
                maxMacros: 10000,
                maxBuffer: 5 * 1024,
                formatError: (jax, error) => jax.formatError(error)
            }
        };
    </script>
    <script src="static/js/marked.min.js" defer></script>
    <script src="static/js/js-yaml.min.js" defer></script>
    <script id="MathJax-script" src="static/js/tex-svg.js" defer></script>
    <script src="static/js/scripts.js" defer></script>
</head>

<body>
    <noscript>
        <div class="alert alert-warning m-3" role="alert">This website requires JavaScript to load its content.</div>
    </noscript>

    <div class="site-shell">
        <aside class="profile-sidebar" aria-label="Profile and navigation">
            <div class="sidebar-inner">
                <a id="page-top-title" class="site-brand" href="#home">Kai Zhu</a>

                <div class="profile-block">
                    <img class="profile-photo" src="static/assets/img/tianming.jpeg" alt="Portrait of Kai Zhu"
                        width="474" height="415" decoding="async" />
                    <div id="home-subtitle" class="profile-name" aria-label="Kai Zhu, 朱凯"></div>
                </div>

                <nav class="section-navigation" aria-label="Page sections">
                    <a class="section-link is-active" href="#home" data-section="home" aria-current="page">
                        <i class="bi bi-person-fill" aria-hidden="true"></i>
                        <span id="nav-home">Home</span>
                    </a>
                    <a class="section-link" href="#awards" data-section="awards">
                        <i class="bi bi-award-fill" aria-hidden="true"></i>
                        <span id="nav-awards">Awards</span>
                    </a>
                    <a class="section-link" href="#experience" data-section="experience">
                        <i class="bi bi-briefcase-fill" aria-hidden="true"></i>
                        <span id="nav-experience">Experience</span>
                    </a>
                    <a class="section-link" href="#publications" data-section="publications">
                        <i class="bi bi-file-text-fill" aria-hidden="true"></i>
                        <span id="nav-publications">Publications</span>
                    </a>
                </nav>

                <button id="language-toggle" class="language-toggle" type="button" aria-label="切换到中文">
                    中文
                </button>

                <footer class="sidebar-footer">
                    <div id="copyright-text"></div>
                    <div class="footer-links">
                        <a href="https://github.com/brownzhu">GitHub</a>
                        <span aria-hidden="true">·</span>
                        <a href="https://github.com/brownzhu/brownzhu.github.io/blob/main/LICENSE">License</a>
                    </div>
                </footer>
            </div>
        </aside>

        <main id="content-workspace" class="content-workspace" tabindex="-1">
            <h1 class="visually-hidden">Kai Zhu's Academic Homepage</h1>
            <div class="content-frame">
                <section id="home" class="content-panel is-active" data-section-panel="home">
                    <div class="hero-banner" role="img" aria-label="Homepage banner">
                        <p id="top-section-bg-text" class="hero-quote"></p>
                    </div>
                    <div class="panel-body home-body">
                        <div class="main-body" id="home-md"></div>
                    </div>
                </section>

                <section id="awards" class="content-panel" data-section-panel="awards" hidden>
                    <header class="panel-header">
                        <h2 id="awards-subtitle" tabindex="-1"><i class="bi bi-award-fill"></i>&nbsp;Awards</h2>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="awards-md"></div>
                    </div>
                </section>

                <section id="experience" class="content-panel" data-section-panel="experience" hidden>
                    <header class="panel-header">
                        <h2 id="experience-subtitle" tabindex="-1"><i class="bi bi-briefcase-fill"></i>&nbsp;Research
                            Experience</h2>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="experience-md"></div>
                    </div>
                </section>

                <section id="publications" class="content-panel" data-section-panel="publications" hidden>
                    <header class="panel-header">
                        <h2 id="publications-subtitle" tabindex="-1"><i class="bi bi-file-text-fill"></i>&nbsp;Publications
                        </h2>
                    </header>
                    <div class="panel-body">
                        <div class="main-body" id="publications-md"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
